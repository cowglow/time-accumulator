<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Time Accumulator</title>

    <!-- Brand pack: icons, manifest, theme colour (see docs/brand/BRAND.md).
         Vite resolves %BASE_URL% to the configured base, /time-accumulator/. -->
    <meta name="description" content="Toggle time on and off and accumulate it into pools." />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eceeef" media="(prefers-color-scheme: light)" />

    <!-- Link previews (the image URL has to be absolute) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Time Accumulator" />
    <meta property="og:description" content="Toggle time on and off and accumulate it into pools." />
    <meta property="og:url" content="https://cowglow.github.io/time-accumulator/" />
    <meta property="og:image" content="https://cowglow.github.io/time-accumulator/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
