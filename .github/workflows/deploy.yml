name: Update Website

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Deploy Update
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned in .nvmrc: Node 26 ships its own (flag-gated) localStorage
          # global that shadows jsdom's and breaks the test suite.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5