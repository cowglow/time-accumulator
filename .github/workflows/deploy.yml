name: Update Website

on:
  workflow_dispatch:
  push:
    branches:
      - master

# One Pages deployment at a time. Don't cancel a run that's in progress, so a
# deployment is never cut off halfway; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned in .nvmrc: Node 26 ships its own (flag-gated) localStorage
          # global that shadows jsdom's and breaks the test suite.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job, as in GitHub's Pages starter workflow. With upload and
  # deploy in one job, deploy-pages sometimes looked up the artifact before
  # it was registered and failed with "Fetching artifact metadata failed".
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
